<style>
  :root{
    --bg: #F7F1E8;
    --burgundy: #6B2737;
    --burgundy-dark: #4E1C29;
    --gold: #B8935A;
    --blush: #E8C4C4;
    --ink: #2B2320;
    --ink-soft: #6b5f57;
    --sage: #7C9473;
    --amber: #C08A3E;
    --dusty-blue: #7C93A8;
    --card: #FFFFFF;
    --line: #E4D9C8;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3, .display{ font-family:'Amiri', serif; }
  .topbar{
    background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
    color: #F7F1E8;
    padding: 28px 24px 40px;
    position: relative;
  }
  .topbar h1{ font-size: 30px; margin: 0 0 4px; font-weight: 700; }
  .topbar p{ margin:0; color: var(--blush); font-size: 14px; letter-spacing: 0.5px; }
  .scallop{
    position:absolute; bottom:-1px; left:0; right:0; height:18px;
    background: radial-gradient(circle at 9px 0, transparent 9px, var(--bg) 10px) 0 -9px / 18px 18px repeat-x;
  }
  .nav{
    display:flex; gap:8px; padding: 16px 20px 0;
    max-width: 960px; margin: 0 auto; overflow-x:auto;
  }
  .nav button{
    border:none; background: transparent; color: var(--ink-soft);
    font-family:'Cairo'; font-size:15px; font-weight:600;
    padding:10px 18px; border-radius: 999px; cursor:pointer;
    white-space:nowrap; transition: all .15s ease;
  }
  .nav button.active{ background: var(--burgundy); color: #fff; }
  .nav button:not(.active):hover{ background: var(--blush); color: var(--burgundy-dark); }
  main{ max-width: 960px; margin: 0 auto; padding: 20px 20px 80px; }
  .stats{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap:12px; margin-bottom: 22px;
  }
  .stat-card{ background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .stat-card .num{ font-family:'Amiri'; font-size: 28px; color: var(--burgundy); font-weight:700; line-height:1; }
  .stat-card .label{ font-size: 13px; color: var(--ink-soft); margin-top:6px; }
  .stat-card.good .num{ color: var(--sage); }
  .stat-card.warn .num{ color: #a33; }
  .section-title{ display:flex; align-items:center; gap:10px; margin: 26px 0 12px; }
  .section-title h2{ font-size:20px; margin:0; color:var(--burgundy-dark); }
  .section-title .dash{ flex:1; height:1px; background: var(--line); }
  .card{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); padding:18px; margin-bottom:14px; }
  .form-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
  label{ font-size:12px; color: var(--ink-soft); display:block; margin-bottom:4px; }
  input, select{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    font-family:'Cairo'; font-size:14px; background: #FCFAF6; color:var(--ink);
  }
  input:focus, select:focus{ outline: 2px solid var(--gold); outline-offset:1px; }
  .btn{
    border:none; border-radius:9px; padding:11px 20px; font-family:'Cairo';
    font-weight:700; font-size:14px; cursor:pointer; transition: transform .1s ease, opacity .15s;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--burgundy); color:#fff; }
  .btn-primary:hover{ background: var(--burgundy-dark); }
  .btn-ghost{ background: transparent; color: var(--burgundy); border:1px solid var(--burgundy); }
  .btn-gold{ background: var(--gold); color:#fff; }
  .btn-danger{ background: transparent; color:#a33; border:1px solid #d8b0b0; font-weight:600; font-size:13px; padding:7px 12px;}
  .btn-row{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
  .dress-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:14px; }
  .dress-card{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; }
  .swatch{ height: 160px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; cursor:pointer; }
  .swatch img{ width:100%; height:100%; object-fit:cover; display:block; }
  .swatch .no-photo{ font-size:12px; color:#fff; opacity:.75; }
  .photo-preview{ width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--line); display:none; margin-top:6px; }
  .dress-lightbox{ position:fixed; inset:0; background:rgba(20,10,10,.85); display:none; align-items:center; justify-content:center; z-index:999; padding:24px; }
  .dress-lightbox.open{ display:flex; }
  .dress-lightbox img{ max-width:100%; max-height:100%; border-radius:12px; }
  .code-tag{
    position:absolute; top:8px; left:8px; background:rgba(255,255,255,.85);
    color: var(--burgundy-dark); font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;
    letter-spacing: 0.5px;
  }
  .dress-body{ padding:14px; }
  .dress-body h3{ margin:0 0 4px; font-size:17px; color: var(--burgundy-dark); }
  .meta{ font-size:13px; color: var(--ink-soft); margin:2px 0; }
  .badge{ display:inline-block; font-size:12px; font-weight:700; padding:3px 12px; border-radius:999px; margin-top:8px; }
  .badge.available{ background:#E7EEE3; color: var(--sage); }
  .badge.rented{ background:#F4E7D3; color: var(--amber); }
  .badge.cleaning{ background:#E4EBF1; color: var(--dusty-blue); }
  .dress-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:6px; flex-wrap:wrap;}
  .booking-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 0; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap;
  }
  .booking-row:last-child{ border-bottom:none; }
  .booking-info b{ color: var(--burgundy-dark); }
  .booking-dates{ font-size:13px; color: var(--ink-soft); }
  .money-line{ font-size:13px; margin-top:4px; }
  .money-line span{ margin-left:12px; }
  .paid{ color: var(--sage); font-weight:700; }
  .due{ color:#a33; font-weight:700; }
  .empty{ text-align:center; color: var(--ink-soft); padding: 40px 20px; font-size:14px; }
  .empty .display{ font-size:22px; color: var(--burgundy); display:block; margin-bottom:6px;}
  table{ width:100%; border-collapse: collapse; font-size:13px; }
  th, td{ text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); }
  th{ color: var(--ink-soft); font-weight:600; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,35,32,.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:#fff; border-radius:var(--radius); max-width:360px; width:100%;
    padding:22px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .receipt-box{
    background:#FCFAF6; border:1px dashed var(--line); border-radius:10px;
    padding:16px; font-size:13.5px; line-height:1.9; white-space:pre-wrap;
    font-family: 'Cairo'; color: var(--ink);
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--burgundy-dark); color:#fff; padding:10px 20px;
    border-radius:999px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s;
  }
  .toast.show{ opacity:1; }
  body.dark{
    --bg:#1E1815; --card:#2A2220; --ink:#EDE6DD; --ink-soft:#B8AA9E;
    --line:#4A3F38; --burgundy:#8A3B4E; --burgundy-dark:#6B2737;
  }
  body.dark .swatch{ background:#3a302b; }
  body.dark input, body.dark select{ background:#241D1A; color:var(--ink); border-color:var(--line); }
  body.dark .no-photo{ color:#ddd; }
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .filter-bar input, .filter-bar select{ flex:1; min-width:140px; }
  .dress-checklist{
    display:flex; flex-direction:column; gap:2px; max-height:220px; overflow-y:auto;
    border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:#FCFAF6;
  }
  .dress-check-item{ display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:14px; cursor:pointer; }
  .dress-check-item input{ width:auto; flex:none; }
  body.dark .dress-checklist{ background:#241D1A; }
  .backup-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .cal-weekday{ text-align:center; font-size:11px; color:var(--ink-soft); font-weight:700; padding:4px 0; }
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; cursor:pointer; background:#FCFAF6; border:1px solid var(--line); position:relative;
  }
  .cal-cell.empty{ background:transparent; border:none; cursor:default; }
  .cal-cell.today{ border-color:var(--gold); border-width:2px; }
  .cal-cell:hover:not(.empty){ background: var(--blush); }
  .cal-daynum{ font-size:13px; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; margin-top:2px; position:static; }
  .cal-dot.busy{ background:#a33; }
  .cal-dot.past{ background:var(--sage); }
  .cal-legend{ display:flex; gap:16px; margin-top:14px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap; align-items:center; }
  .cal-legend .cal-dot{ display:inline-block; margin-inline-end:4px; }
  .shop-logo-wrap img{ width:48px; height:48px; border-radius:12px; object-fit:cover; border:2px solid rgba(255,255,255,.4); display:block; }
</style>
</head>
<body>
<div id="lock-screen"></div>
<div id="offlineBanner" style="display:none; background:#a33; color:#fff; text-align:center; padding:8px 12px; font-size:13px; font-family:'Cairo';">
  ⚠ لا يوجد اتصال بالإنترنت — كتشوف آخر نسخة محفوظة فهاد الجهاز، والتعديلات ما غاديش تتحفظ حتى يرجع الاتصال
</div>

<div class="topbar">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div id="shopLogoWrap" class="shop-logo-wrap"></div>
      <div>
        <h1 class="display" id="shopNameHeading">💐 Royaume de la Mariée</h1>
        <p>إدارة المخزون والحجوزات لمحلك</p>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button onclick="lockNow()" style="background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Cairo';">🔒 قفل</button>
      <button onclick="toggleNotifications()" id="notifBtn" title="تفعيل/إيقاف تنبيهات الإرجاع والخروج" style="background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Cairo';">🔕</button>
      <button onclick="toggleDarkMode()" id="darkModeBtn" style="background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Cairo';">🌙</button>

<div class="nav">

  <button data-tab="bookings">الحجوزات</button>
  <button data-tab="calendar">التقويم</button>
  <button data-tab="reports">التقارير</button>

<main id="app"></main>
<div class="dress-lightbox" id="dressLightbox" onclick="closeLightbox()"><img id="dressLightboxImg" src=""></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoazDRPLvecSX-I1usog5-U6ib6LL10cI",
  authDomain: "royaume-de-la-mriee.firebaseapp.com",
  projectId: "royaume-de-la-mriee",
  storageBucket: "royaume-de-la-mriee.firebasestorage.app",
  messagingSenderId: "1010586121552",
  appId: "1:1010586121552:web:aa3f8401fa50465656e855",
  measurementId: "G-6L0TM7BCYN"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// Firestore keeps a local copy of everything it has ever synced (IndexedDB).
// With this enabled: reads work offline (from that local copy), and any
// add/update/delete made while offline is queued and sent automatically the
// moment the connection comes back — no more losing offline edits.
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  if(err.code === 'failed-precondition'){
    // Persistence can only be enabled in one browser tab at a time.
    console.warn('Offline persistence: app is open in another tab already.');
  } else if(err.code === 'unimplemented'){
    console.warn('Offline persistence: not supported in this browser.');
  }
});
const auth = firebase.auth();
// The app uses a single shop-wide account behind the scenes (the person only
// ever types a password, never an email) so this login doesn't collide with
// any other Firebase project using the same auth backend.
const APP_LOGIN_EMAIL = 'shop-owner@royaume-de-la-mariee.app';
// Require a real sign-in every time the app is opened (matches the previous
// "always show the lock screen on launch" behavior) instead of silently
// staying signed in across browser restarts.
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(e=>console.error('auth persistence error', e));
const DRESSES_COL = db.collection('dresses');
const BOOKINGS_COL = db.collection('bookings');
const BACKUPS_COL = db.collection('backups');
const SETTINGS_DOC = db.collection('settings').doc('app');

const COLORS = {
  'أحمر': '#C0392B', 'أزرق':'#2E5C8A', 'أخضر':'#3F6B4A', 'ذهبي':'#B8935A',
  'وردي':'#D98BA6', 'أبيض':'#E8E2D6', 'أسود':'#2B2320', 'بنفسجي':'#7D5A8C'
};

const now_ = new Date();
let state = {
  dresses: [], bookings: [], tab: 'dashboard', loaded:false,
  dressSearch:'', dressStatusFilter:'all',
  bookingSearch:'', bookingStatusFilter:'all',
  customerSearch:'',
  calendarYear: now_.getFullYear(), calendarMonth: now_.getMonth(),
  recentBackups: [],
  shopName: 'Royaume de la Mariée', shopPhone: '', shopLogo: null,
  offline: false
};

let __settingsCache = null;

async function __loadSettingsDoc(){
  if(__settingsCache) return __settingsCache;
  try{
    const snap = await SETTINGS_DOC.get();
    __settingsCache = snap.exists ? snap.data() : {};
  }catch(e){
    console.error('Firestore settings load error', e);
    __settingsCache = {};
  }
  return __settingsCache;
}

async function storageGet(key){
  try{
    const data = await __loadSettingsDoc();
    if(data && data[key] !== undefined && data[key] !== null){
      return { value: data[key] };
    }
    return null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    await SETTINGS_DOC.set({ [key]: value }, { merge: true });
    const data = await __loadSettingsDoc();
    data[key] = value;
    return { value };
  }catch(e){
    console.error('Firestore settings save error', e);
    if(typeof showToast === 'function') showToast('تعذر الحفظ، تحقق من الاتصال بالإنترنت');
    return null;
  }
}

// Saves the current dresses/bookings to localStorage so the app has something
// to show the next time it can't reach Firestore (e.g. no internet).
function cacheLocalData(){
  try{
    localStorage.setItem('rm_cache_dresses', JSON.stringify(state.dresses));
    localStorage.setItem('rm_cache_bookings', JSON.stringify(state.bookings));
  }catch(e){ /* storage full or unavailable, safe to ignore */ }
}
function readLocalCache(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}

async function loadData(){
  let dressesOk = false, bookingsOk = false;
  try{
    const snap = await DRESSES_COL.get();
    state.dresses = snap.docs.map(d=>d.data());
    dressesOk = true;
  }catch(e){ console.error('load dresses error', e); }
  try{
    const snap = await BOOKINGS_COL.get();
    state.bookings = snap.docs.map(d=>d.data());
    bookingsOk = true;
  }catch(e){ console.error('load bookings error', e); }

  if(!dressesOk) state.dresses = readLocalCache('rm_cache_dresses');
  if(!bookingsOk) state.bookings = readLocalCache('rm_cache_bookings');

  if(dressesOk && bookingsOk){
    cacheLocalData();
    setOfflineMode(false);
  } else {
    setOfflineMode(true);
  }
  state.loaded = true;
}

// Shows/hides the "no connection" banner and remembers whether we're
// currently working from cached (possibly outdated) local data.
function setOfflineMode(isOffline){
  state.offline = isOffline;
  const banner = document.getElementById('offlineBanner');
  if(banner) banner.style.display = isOffline ? 'block' : 'none';
}

// Tries loadData() again once the browser reports it's back online, so the
// app switches from cached data to live Firestore data without a manual reload.
async function retrySyncIfOffline(){
  if(!state.offline || !state.loaded) return;
  await loadData();
  if(!state.offline) showToast('تم استعادة الاتصال، البيانات محدثة ✓');
  render();
}
window.addEventListener('online', retrySyncIfOffline);
window.addEventListener('offline', ()=> setOfflineMode(true));

async function saveDressToCloud(dress){
  try{ await DRESSES_COL.doc(dress.id).set(dress); }
  catch(e){ console.error('save dress error', e); showToast('تعذر حفظ الفستان، تحقق من الاتصال'); }
}
async function deleteDressFromCloud(id){
  try{ await DRESSES_COL.doc(id).delete(); }
  catch(e){ console.error('delete dress error', e); showToast('تعذر حذف الفستان'); }
}
async function saveBookingToCloud(booking){
  try{ await BOOKINGS_COL.doc(booking.id).set(booking); }
  catch(e){ console.error('save booking error', e); showToast('تعذر حفظ الحجز، تحقق من الاتصال'); }
}
async function deleteBookingFromCloud(id){
  try{ await BOOKINGS_COL.doc(id).delete(); }
  catch(e){ console.error('delete booking error', e); showToast('تعذر حذف الحجز'); }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// Escapes user-entered text before it is inserted into innerHTML, to prevent stored XSS
// (e.g. a customer or dress name containing "<script>" or event-handler attributes).
function esc(str){
  return String(str==null ? '' : str).replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

function nextDressCode(){
  let max = 0;
  state.dresses.forEach(d=>{
    const m = /FS-(\d+)/.exec(d.code||'');
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'FS-' + String(max+1).padStart(3,'0');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

async function toggleDarkMode(){
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('darkModeBtn').textContent = isDark ? '☀️' : '🌙';
  await storageSet('dark_mode', isDark ? 'true' : 'false');
}
async function applySavedDarkMode(){
  const saved = await storageGet('dark_mode');
  if(saved && saved.value === 'true'){
    document.body.classList.add('dark');
    document.getElementById('darkModeBtn').textContent = '☀️';
  }
}

function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.nav button').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  if(tab === 'reports') refreshBackupsList();
  render();
}
document.querySelectorAll('.nav button').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function previewDressImage(e){
  const file = e.target.files[0];
  const preview = document.getElementById('dressImgPreview');
  if(!file){ preview.style.display='none'; return; }
  resizeImageFile(file, 300, 0.7).then(dataUrl=>{

function daysBetween(start, end){
  const s = new Date(start), e = new Date(end);
  const diff = Math.round((e-s)/(1000*60*60*24));
  return Math.max(diff, 1);
}

// Returns a booking's dresses as an array of {dressId, dressName, dressCode},
// whether it was saved in the new multi-dress shape or the old single-dress shape.
// Normalizes so every entry has a `returned` flag (falling back to the legacy
// booking-level `returned` field for old data that predates per-dress tracking).
function bookingDressList(b){
  if(Array.isArray(b.dresses) && b.dresses.length){
    return b.dresses.map(d=> ({ ...d, returned: d.returned !== undefined ? d.returned : !!b.returned }));
  }
  if(b.dressId) return [{ dressId:b.dressId, dressName:b.dressName, dressCode:b.dressCode, returned: !!b.returned }];
  return [];
}
function bookingDressLabel(b){
  return bookingDressList(b).map(d=> `${d.dressName} (${d.dressCode})${d.returned ? ' ✓' : ''}`).join('، ');
}
function bookingDressCodes(b){
  return bookingDressList(b).map(d=> d.dressCode).join('، ');
}
function isBookingFullyReturned(b){
  const list = bookingDressList(b);
  return list.length > 0 && list.every(d=> d.returned);
}
function bookingReturnStatusLabel(b){
  const list = bookingDressList(b);
  const returnedCount = list.filter(d=>d.returned).length;
  if(!returnedCount) return '';
  if(returnedCount === list.length) return '· <span style="color:var(--sage)">تم إرجاع الكل</span>';
  return `· <span style="color:var(--sage)">تم إرجاع ${returnedCount}/${list.length}</span>`;
}
// Renders one "تم الإرجاع" button per still-out dress, plus a bulk "إرجاع الكل"
// button when more than one dress in the booking hasn't come back yet.
function bookingReturnButtonHTML(b){
  const pending = bookingDressList(b).filter(d=>!d.returned);
  if(!pending.length) return '';
  if(pending.length === 1){
    return `<button class="btn btn-ghost" onclick="markDressReturned('${b.id}','${pending[0].dressId}')">تم الإرجاع</button>`;
  }
  return `<div style="display:flex; flex-direction:column; gap:4px; align-items:stretch;">
    ${pending.map(d=> `<button class="btn btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="markDressReturned('${b.id}','${d.dressId}')">إرجاع ${esc(d.dressCode)}</button>`).join('')}
    <button class="btn btn-gold" style="padding:5px 10px; font-size:12px;" onclick="markReturned('${b.id}')">إرجاع الكل</button>
  </div>`;
}

function findBookingConflict(dressId, start, end, excludeBookingId){
  if(!start || !end) return null;
  return state.bookings.find(b =>
    b.id !== excludeBookingId &&
    start <= b.end && b.start <= end &&
    bookingDressList(b).some(d=> d.dressId === dressId && !d.returned)
  ) || null;
}

function onBookingDressOrDateChange(form){
  const checked = [...form.querySelectorAll('input[name="dresses"]:checked')];
  const selectedDresses = checked.map(cb=> state.dresses.find(d=>d.id===cb.value)).filter(Boolean);
  if(selectedDresses.length && form.start.value && form.end.value){
    const days = daysBetween(form.start.value, form.end.value);
    const sum = selectedDresses.reduce((s,d)=> s + (d.price||0), 0);
    form.total.value = (sum * days).toFixed(2);
  }
  const msgEl = document.getElementById('conflictMsg');
  if(!msgEl) return;
  const conflicts = checked
    .map(cb=> findBookingConflict(cb.value, form.start.value, form.end.value, form.dataset.editingId || null))
    .filter(Boolean);
  if(conflicts.length){
    msgEl.style.display = 'block';
    msgEl.textContent = conflicts.map(c=>
      `⚠ ${esc(bookingDressLabel(c))} محجوز فعلا من ${c.start} إلى ${c.end} (الزبونة: ${esc(c.customer)}).`
    ).join(' ');
  } else {
    msgEl.style.display = 'none';
    msgEl.textContent = '';
  }
}

// Recomputes a dress's status from scratch based on all bookings: "rented" if
// it's out on some non-returned booking right now, "cleaning" if it has been
// booked before but isn't currently out, or left untouched (e.g. "available")
// if it has never been part of any booking.
function recalcDressStatus(dress){
  const activeElsewhere = state.bookings.some(x=>
    bookingDressList(x).some(bd=> bd.dressId===dress.id && !bd.returned)
  );
  if(activeElsewhere){ dress.status = 'rented'; return; }
  const wasEverBooked = state.bookings.some(x=> bookingDressList(x).some(bd=> bd.dressId===dress.id));
  if(wasEverBooked) dress.status = 'cleaning';
}

async function saveBookingEdit(e, id){
  e.preventDefault();
  const f = e.target;
  const b = state.bookings.find(x=>x.id===id);
  if(!b) return;
  const checked = [...f.querySelectorAll('input[name="dresses"]:checked')];
  if(!checked.length){ alert('اختر فستانا واحدا على الأقل'); return; }
  const selectedDresses = checked.map(cb=> state.dresses.find(d=>d.id===cb.value)).filter(Boolean);
  const start = f.start.value, end = f.end.value;
  if(start && end && end < start){
    alert('تاريخ النهاية يجب أن يكون بعد تاريخ البداية أو مساويا له');
    return;
  }
  for(const d of selectedDresses){
    const conflict = findBookingConflict(d.id, start, end, id);
    if(conflict){
      alert(`لا يمكن الحجز: ${bookingDressLabel(conflict)} محجوز فعلا من ${conflict.start} إلى ${conflict.end} (الزبونة: ${conflict.customer}). اختر تواريخ أخرى أو فستانا آخر.`);
      return;
    }
  }
  const oldDressIds = bookingDressList(b).map(d=>d.dressId);
  const oldReturnedMap = {};
  bookingDressList(b).forEach(d=> oldReturnedMap[d.dressId] = d.returned);

  const total = parseFloat(f.total.value) || 0;
  let paid = Math.max(0, parseFloat(f.paid.value) || 0);
  if(paid > total) paid = total;

  b.customer = f.customer.value.trim();
  b.phone = f.phone.value.trim();
  b.start = start;
  b.end = end;
  b.total = total;
  b.paid = paid;
  b.dresses = selectedDresses.map(d=> ({
    dressId: d.id, dressName: d.name, dressCode: d.code,
    returned: oldReturnedMap[d.id] !== undefined ? oldReturnedMap[d.id] : false
  }));
  delete b.dressId; delete b.dressName; delete b.dressCode;
  b.returned = b.dresses.every(d=>d.returned);

  if(!b.customer || !b.start || !b.end) return;

  const involvedIds = Array.from(new Set([...oldDressIds, ...b.dresses.map(d=>d.dressId)]));
  const involvedDresses = involvedIds.map(idd=> state.dresses.find(x=>x.id===idd)).filter(Boolean);
  involvedDresses.forEach(recalcDressStatus);

  await saveBookingToCloud(b);
  await Promise.all(involvedDresses.map(d=> saveDressToCloud(d)));
  closeModal();
  showToast('تم حفظ تعديلات الحجز ✓');
  render();
}

// Marks every dress in a booking as returned in one go ("إرجاع الكل").
async function markReturned(id){
  const b = state.bookings.find(b=>b.id===id);
  if(!b) return;
  b.dresses = bookingDressList(b).map(d=> ({ ...d, returned:true }));
  delete b.dressId; delete b.dressName; delete b.dressCode;
  b.returned = true;
  await syncDressStatusesForBooking(b);
}

// Marks a single dress within a (possibly multi-dress) booking as returned,
// leaving the rest of the booking's dresses untouched.
async function markDressReturned(bookingId, dressId){
  const b = state.bookings.find(x=>x.id===bookingId);
  if(!b) return;
  b.dresses = bookingDressList(b);
  delete b.dressId; delete b.dressName; delete b.dressCode;
  const entry = b.dresses.find(d=>d.dressId===dressId);
  if(entry) entry.returned = true;
  b.returned = b.dresses.every(d=>d.returned);
  await syncDressStatusesForBooking(b);
}

// Shared save step: for every dress touched by this booking, figure out whether
// it's still out on another active booking and set its status accordingly, then persist.
async function syncDressStatusesForBooking(b){
  const involvedDresses = bookingDressList(b)
    .map(d=> state.dresses.find(x=>x.id===d.dressId))
    .filter(Boolean);
  involvedDresses.forEach(dress=>{
    const stillActive = state.bookings.some(x=>
      bookingDressList(x).some(bd=> bd.dressId===dress.id && !bd.returned)
    );
    dress.status = stillActive ? 'rented' : 'cleaning';
  });
  render();
  await saveBookingToCloud(b);
  await Promise.all(involvedDresses.map(d=> saveDressToCloud(d)));
}

function statusLabel(status){ return {available:'متوفر', rented:'مكرى', cleaning:'فالتنظيف'}[status] || status; }

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d-today)/(1000*60*60*24));
}

function relativeDayLabel(diff){
  if(diff === 0) return 'اليوم';
  if(diff === 1) return 'غدا';
  if(diff === 2) return 'بعد غد';
  if(diff < 0) return `متأخر ${Math.abs(diff)} يوم`;
  return `بعد ${diff} أيام`;
}

const ALERT_WINDOW_DAYS = 2;

function computeAlerts(){
  const overdue = [], dueSoon = [], pickupSoon = [];
  state.bookings.forEach(b=>{
    if(!isBookingFullyReturned(b)){
      const endDiff = daysUntil(b.end);
      if(endDiff < 0) overdue.push({...b, diff:endDiff});
      else if(endDiff <= ALERT_WINDOW_DAYS) dueSoon.push({...b, diff:endDiff});
      const startDiff = daysUntil(b.start);
      if(startDiff >= 0 && startDiff <= ALERT_WINDOW_DAYS) pickupSoon.push({...b, diff:startDiff});
    }
  });
  overdue.sort((a,b)=> a.diff-b.diff);
  dueSoon.sort((a,b)=> a.diff-b.diff);
  pickupSoon.sort((a,b)=> a.diff-b.diff);
  return { overdue, dueSoon, pickupSoon };
}

function bookingUrgencyBadge(b){
  if(isBookingFullyReturned(b)) return '';
  const diff = daysUntil(b.end);
  if(diff < 0) return `<span style="color:#a33; font-weight:700; font-size:12px; margin-inline-start:8px;">⛔ متأخر ${Math.abs(diff)} يوم</span>`;
  if(diff <= ALERT_WINDOW_DAYS) return `<span style="color:var(--amber); font-weight:700; font-size:12px; margin-inline-start:8px;">⏰ ${relativeDayLabel(diff)}</span>`;
  return '';
}

function renderAlertsSection(){
  const { overdue, dueSoon, pickupSoon } = computeAlerts();
  if(!overdue.length && !dueSoon.length && !pickupSoon.length) return '';
  return `

async function toggleNotifications(){
  if(!('Notification' in window)){
    showToast('المتصفح لا يدعم الإشعارات');

  if(Notification.permission !== 'granted'){
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      showToast('يجب السماح بالإشعارات من إعدادات المتصفح');
      return;
    }
  }
  const current = await storageGet('notifications_enabled');
  const newVal = !(current && current.value === 'true');
  await storageSet('notifications_enabled', newVal ? 'true' : 'false');
  updateNotifBtnUI(newVal);
  showToast(newVal ? 'تم تفعيل تنبيهات الإرجاع والخروج ✓' : 'تم إيقاف الإشعارات');
  if(newVal) checkAndNotify(true);
}

}

async function applySavedNotifSetting(){
  if(!('Notification' in window)) return;
  const saved = await storageGet('notifications_enabled');
  const enabled = !!(saved && saved.value === 'true' && Notification.permission === 'granted');
  updateNotifBtnUI(enabled);
}

async function checkAndNotify(force){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  const enabledSetting = await storageGet('notifications_enabled');
  if(!enabledSetting || enabledSetting.value !== 'true') return;
  const { overdue, dueSoon, pickupSoon } = computeAlerts();
  const total = overdue.length + dueSoon.length + pickupSoon.length;
  if(total === 0) return;
  if(!force){
    const todayStr = new Date().toISOString().slice(0,10);
    const last = await storageGet('last_notified_date');
    if(last && last.value === todayStr) return;
    await storageSet('last_notified_date', todayStr);
  }
  const parts = [];
  if(overdue.length) parts.push(`${overdue.length} حجز متأخر فالإرجاع`);
  if(dueSoon.length) parts.push(`${dueSoon.length} حجز قريب الإرجاع`);
  if(pickupSoon.length) parts.push(`${pickupSoon.length} حجز قريب الخروج`);
  try{
    new Notification('Royaume de la Mariée 🔔', { body: parts.join(' · ') });
  }catch(e){ console.error('notification error', e); }
}

// Normalizes an Algerian phone number into the international digits format
// required by wa.me (no "+", no spaces/dashes). Handles the common ways
// customers' numbers get typed in: local "0xxxxxxxxx", already-international
// "+213xxxxxxxxx" / "213xxxxxxxxx" / "00213xxxxxxxxx", or with spaces/dashes in between.
function normalizePhone(phone){
  let p = String(phone||'').trim().replace(/[^0-9+]/g,'');
  if(p.startsWith('+')) p = p.slice(1);
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('213')) return p;
  if(p.startsWith('0')) return '213' + p.slice(1);
  return '213' + p;
}

function copyReceipt(){
  const text = document.getElementById('receipt-text').innerText;
  const finish = ()=> showToast('تم نسخ الوصل ✓');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(()=> fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}
function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){ showToast('تعذر النسخ، انسخ يدويا'); }
}

function printReceipt(){

const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
const ARABIC_WEEKDAYS = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

function pad2(n){ return String(n).padStart(2,'0'); }
function toDateStr(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

function getBookingsForDate(dateStr){
  return state.bookings.filter(b=> dateStr >= b.start && dateStr <= b.end);
}

function changeCalendarMonth(delta){
  let m = state.calendarMonth + delta;
  let y = state.calendarYear;
  if(m < 0){ m = 11; y--; }
  if(m > 11){ m = 0; y++; }
  state.calendarMonth = m; state.calendarYear = y;
  render();
}

function renderCalendar(){
  const y = state.calendarYear, m = state.calendarMonth;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = toDateStr(y,m,d);
    const bookingsToday = getBookingsForDate(dateStr);
    const isToday = dateStr === todayStr;
    let dotClass = '';
    if(bookingsToday.length){
      dotClass = bookingsToday.some(b=>!isBookingFullyReturned(b)) ? 'busy' : 'past';
    }
    cells += `<div class="cal-cell ${isToday?'today':''}" onclick="showDayBookings('${dateStr}')">
      <div class="cal-daynum">${d}</div>
      ${bookingsToday.length ? `<div class="cal-dot ${dotClass}"></div>` : ''}
    </div>`;
  }

  return `
    <div class="section-title"><h2 class="display">📅 تقويم الحجوزات</h2><div class="dash"></div></div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <button class="btn btn-ghost" onclick="changeCalendarMonth(-1)">‹ السابق</button>
        <div style="font-weight:700; font-family:'Amiri'; font-size:18px; color:var(--burgundy-dark);">${ARABIC_MONTHS[m]} ${y}</div>
        <button class="btn btn-ghost" onclick="changeCalendarMonth(1)">التالي ›</button>
      </div>
      <div class="cal-grid cal-weekdays">
        ${ARABIC_WEEKDAYS.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend">
        <span><span class="cal-dot busy"></span>فيها حجز نشط</span>
        <span><span class="cal-dot past"></span>حجز راجع/منتهي</span>
      </div>
    </div>
    <div id="dayBookingsWrap">${(function(){
      const t = getBookingsForDate(todayStr);
      return t.length ? dayBookingsHTML(todayStr) : `<div class="card empty" style="padding:20px;"><span class="display">اليوم</span>لا توجد حجوزات نشطة اليوم، اضغط على أي يوم فالتقويم لتفاصيله</div>`;
    })()}</div>
  `;
}

function getCustomerSummaries(query){
  const map = {};
  state.bookings.forEach(b=>{
    const key = (b.customer||'').trim().toLowerCase();
    if(!key) return;
    if(!map[key]) map[key] = { name: b.customer, phone: b.phone||'', bookings: [], totalPaid:0, totalDue:0, totalAgreed:0 };
    map[key].bookings.push(b);
    map[key].totalPaid += b.paid;
    map[key].totalAgreed += b.total;
    map[key].totalDue += (b.total - b.paid);
    if(!map[key].phone && b.phone) map[key].phone = b.phone;
  });
  let list = Object.values(map);
  if(query){
    const q = query.toLowerCase();
    list = list.filter(c=> c.name.toLowerCase().includes(q) || (c.phone && c.phone.toLowerCase().includes(q)));
  }
  list.sort((a,b)=> b.bookings.length - a.bookings.length);
  return list;
}

    return `<div class="empty"><span class="display">لا توجد نتائج</span>جرب اسم أو رقم هاتف آخر</div>`;

async function autoBackupIfNeeded(){
  try{
    const todayStr = new Date().toISOString().slice(0,10);
    const last = await storageGet('last_auto_backup_date');
    if(last && last.value === todayStr) return;
    const backupDoc = {
      date: todayStr,
      timestamp: new Date().toISOString(),
      dresses: state.dresses,
      bookings: state.bookings
    };
    await BACKUPS_COL.doc(todayStr).set(backupDoc);
    await storageSet('last_auto_backup_date', todayStr);
    const snap = await BACKUPS_COL.orderBy('date','desc').get();
    const docs = snap.docs;
    if(docs.length > 14){
      const toDelete = docs.slice(14);
      const batch = db.batch();
      toDelete.forEach(d=> batch.delete(d.ref));
      await batch.commit();
    }
  }catch(e){ console.error('auto backup error', e); }
}

async function loadRecentBackups(){
  try{
    const snap = await BACKUPS_COL.orderBy('date','desc').limit(14).get();
    return snap.docs.map(d=>d.data());
  }catch(e){ console.error('load backups error', e); return []; }
}

async function restoreAutoBackup(dateId){
  if(!confirm(`متأكد من استرجاع نسخة يوم ${dateId}؟ هذا سيستبدل كل البيانات الحالية.`)) return;
  try{
    const doc = await BACKUPS_COL.doc(dateId).get();
    if(!doc.exists){ showToast('تعذر إيجاد هاد النسخة'); return; }
    const data = doc.data();
    showToast('جاري الاسترجاع...');
    const oldDressIds = state.dresses.map(d=>d.id);
    const oldBookingIds = state.bookings.map(b=>b.id);
    state.dresses = data.dresses || [];
    state.bookings = data.bookings || [];
    const batchSize = 400;
    const allWrites = [
      ...oldDressIds.map(id=>({col:DRESSES_COL, id, del:true})),
      ...oldBookingIds.map(id=>({col:BOOKINGS_COL, id, del:true})),
      ...state.dresses.map(d=>({col:DRESSES_COL, id:d.id, data:d})),
      ...state.bookings.map(b=>({col:BOOKINGS_COL, id:b.id, data:b}))
    ];
    for(let i=0; i<allWrites.length; i+=batchSize){
      const batch = db.batch();
      allWrites.slice(i, i+batchSize).forEach(w=>{
        const ref = w.col.doc(w.id);
        if(w.del) batch.delete(ref); else batch.set(ref, w.data);
      });
      await batch.commit();
    }
    showToast('تم استرجاع النسخة الاحتياطية ✓');
    render();
  }catch(e){
    console.error(e);
    showToast('تعذر الاسترجاع');
  }
}

function exportBackup(){
  const backup = {
    exportedAt: new Date().toISOString(),
    dresses: state.dresses,
    bookings: state.bookings
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `نسخة-احتياطية-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('تم تصدير النسخة الاحتياطية ✓');
}

function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.dresses) || !Array.isArray(data.bookings)){
        showToast('ملف غير صالح');
        return;
      }
      if(!confirm('هذا سيستبدل كل البيانات الحالية بالنسخة المستوردة. متأكد؟')) return;
      showToast('جاري الاستيراد...');
      const oldDressIds = state.dresses.map(d=>d.id);
      const oldBookingIds = state.bookings.map(b=>b.id);
      state.dresses = data.dresses;
      state.bookings = data.bookings;
      const batchSize = 400;
      const allWrites = [
        ...oldDressIds.map(id=>({col:DRESSES_COL, id, del:true})),
        ...oldBookingIds.map(id=>({col:BOOKINGS_COL, id, del:true})),
        ...state.dresses.map(d=>({col:DRESSES_COL, id:d.id, data:d})),
        ...state.bookings.map(b=>({col:BOOKINGS_COL, id:b.id, data:b}))
      ];
      for(let i=0; i<allWrites.length; i+=batchSize){
        const batch = db.batch();
        allWrites.slice(i, i+batchSize).forEach(w=>{
          const ref = w.col.doc(w.id);
          if(w.del) batch.delete(ref); else batch.set(ref, w.data);
        });
        await batch.commit();
      }
      showToast('تم استيراد النسخة الاحتياطية ✓');
      render();
    }catch(err){
      console.error(err);
      showToast('تعذر قراءة الملف أو الاستيراد');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

async function setupPassword(e){
  e.preventDefault();
  const f = e.target;
  const errBox = document.getElementById('setup-error');
  errBox.textContent = '';
  if(f.pw1.value !== f.pw2.value){
    errBox.textContent = 'كلمتا السر غير متطابقتين';
    return;
  }
  try{
    await auth.createUserWithEmailAndPassword(APP_LOGIN_EMAIL, f.pw1.value);
    localStorage.setItem('rm_account_created', 'true');
    await unlockApp();
  }catch(err){
    console.error('signup error', err);
    if(err.code === 'auth/email-already-in-use'){
      localStorage.setItem('rm_account_created', 'true');
      errBox.textContent = 'كلمة السر معينة من قبل، دخلي بيها من "سجلي الدخول"';
    } else if(err.code === 'auth/weak-password'){
      errBox.textContent = 'كلمة السر ضعيفة، اختاري كلمة أطول';
    } else if(err.code === 'auth/operation-not-allowed'){
      errBox.textContent = 'خدمة Email/Password ماشي مفعّلة فـ Firebase، فعّليها من Authentication → Sign-in method';
    } else if(err.code === 'auth/unauthorized-domain'){
      errBox.textContent = 'هاد الدومين ماشي مسموح فـ Firebase، زيديه فـ Authentication → Settings → Authorized domains';
    } else {
      errBox.textContent = 'تعذر إنشاء الحساب (' + (err.code || err.message || 'خطأ غير معروف') + ')';
    }
  }
}

async function loginPassword(e){
  e.preventDefault();
  const f = e.target;
  const errBox = document.getElementById('login-error');
  errBox.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(APP_LOGIN_EMAIL, f.pw.value);
    localStorage.setItem('rm_account_created', 'true');
    await unlockApp();
  }catch(err){
    console.error('login error', err);
    if(err.code === 'auth/user-not-found'){
      errBox.textContent = 'ما كايناش كلمة سر معينة بعد، دوزي على "عيّني كلمة سر"';
    } else if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'){
      errBox.textContent = 'كلمة السر غير صحيحة';
    } else if(err.code === 'auth/operation-not-allowed'){
      errBox.textContent = 'خدمة Email/Password ماشي مفعّلة فـ Firebase، فعّليها من Authentication → Sign-in method';
    } else if(err.code === 'auth/unauthorized-domain'){
      errBox.textContent = 'هاد الدومين ماشي مسموح فـ Firebase، زيديه فـ Authentication → Settings → Authorized domains';
    } else {
      errBox.textContent = 'تعذر تسجيل الدخول (' + (err.code || err.message || 'خطأ غير معروف') + ')';
    }
  }
}

async function unlockApp(){
  const root = document.getElementById('lock-screen');
  root.innerHTML = `<div class="empty">جاري التحميل...</div>`;
  await loadData();
  await applySavedDarkMode();
  await applySavedNotifSetting();
  await applyShopSettings();
  checkAndNotify(false);
  autoBackupIfNeeded();
  root.innerHTML = '';
  root.style.display = 'none';
  render();
}

function lockNow(){
  auth.signOut().catch(e=>console.error('sign out error', e));
  state.loaded = false;
  showLockScreen('login');
}

initApp();
updateAppIcons();

// Caches the app page itself so it can open with no internet connection.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e=> console.error('SW register failed', e));
  });
}
