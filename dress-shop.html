<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reayoum de la mari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F1E8;
    --burgundy: #6B2737;
    --burgundy-dark: #4E1C29;
    --gold: #B8935A;
    --blush: #E8C4C4;
    --ink: #2B2320;
    --ink-soft: #6b5f57;
    --sage: #7C9473;
    --amber: #C08A3E;
    --dusty-blue: #7C93A8;
    --card: #FFFFFF;
    --line: #E4D9C8;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3, .display{ font-family:'Amiri', serif; }
  .topbar{
    background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
    color: #F7F1E8;
    padding: 28px 24px 40px;
    position: relative;
  }
  .topbar h1{ font-size: 30px; margin: 0 0 4px; font-weight: 700; }
  .topbar p{ margin:0; color: var(--blush); font-size: 14px; letter-spacing: 0.5px; }
  .scallop{
    position:absolute; bottom:-1px; left:0; right:0; height:18px;
    background: radial-gradient(circle at 9px 0, transparent 9px, var(--bg) 10px) 0 -9px / 18px 18px repeat-x;
  }
  .nav{
    display:flex; gap:8px; padding: 16px 20px 0;
    max-width: 960px; margin: 0 auto; overflow-x:auto;
  }
  .nav button{
    border:none; background: transparent; color: var(--ink-soft);
    font-family:'Cairo'; font-size:15px; font-weight:600;
    padding:10px 18px; border-radius: 999px; cursor:pointer;
    white-space:nowrap; transition: all .15s ease;
  }
  .nav button.active{ background: var(--burgundy); color: #fff; }
  .nav button:not(.active):hover{ background: var(--blush); color: var(--burgundy-dark); }
  main{ max-width: 960px; margin: 0 auto; padding: 20px 20px 80px; }
  .stats{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap:12px; margin-bottom: 22px;
  }
  .stat-card{ background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .stat-card .num{ font-family:'Amiri'; font-size: 28px; color: var(--burgundy); font-weight:700; line-height:1; }
  .stat-card .label{ font-size: 13px; color: var(--ink-soft); margin-top:6px; }
  .stat-card.good .num{ color: var(--sage); }
  .stat-card.warn .num{ color: #a33; }
  .section-title{ display:flex; align-items:center; gap:10px; margin: 26px 0 12px; }
  .section-title h2{ font-size:20px; margin:0; color:var(--burgundy-dark); }
  .section-title .dash{ flex:1; height:1px; background: var(--line); }
  .card{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); padding:18px; margin-bottom:14px; }
  .form-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
  label{ font-size:12px; color: var(--ink-soft); display:block; margin-bottom:4px; }
  input, select{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    font-family:'Cairo'; font-size:14px; background: #FCFAF6; color:var(--ink);
  }
  input:focus, select:focus{ outline: 2px solid var(--gold); outline-offset:1px; }
  .btn{
    border:none; border-radius:9px; padding:11px 20px; font-family:'Cairo';
    font-weight:700; font-size:14px; cursor:pointer; transition: transform .1s ease, opacity .15s;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--burgundy); color:#fff; }
  .btn-primary:hover{ background: var(--burgundy-dark); }
  .btn-ghost{ background: transparent; color: var(--burgundy); border:1px solid var(--burgundy); }
  .btn-gold{ background: var(--gold); color:#fff; }
  .btn-danger{ background: transparent; color:#a33; border:1px solid #d8b0b0; font-weight:600; font-size:13px; padding:7px 12px;}
  .btn-row{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
  .dress-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:14px; }
  .dress-card{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; }
  .swatch{ height: 60px; display:flex; align-items:center; justify-content:center; position:relative; }
  .code-tag{
    position:absolute; top:8px; left:8px; background:rgba(255,255,255,.85);
    color: var(--burgundy-dark); font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;
    letter-spacing: 0.5px;
  }
  .dress-body{ padding:14px; }
  .dress-body h3{ margin:0 0 4px; font-size:17px; color: var(--burgundy-dark); }
  .meta{ font-size:13px; color: var(--ink-soft); margin:2px 0; }
  .badge{ display:inline-block; font-size:12px; font-weight:700; padding:3px 12px; border-radius:999px; margin-top:8px; }
  .badge.available{ background:#E7EEE3; color: var(--sage); }
  .badge.rented{ background:#F4E7D3; color: var(--amber); }
  .badge.cleaning{ background:#E4EBF1; color: var(--dusty-blue); }
  .dress-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:6px; flex-wrap:wrap;}
  .booking-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 0; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap;
  }
  .booking-row:last-child{ border-bottom:none; }
  .booking-info b{ color: var(--burgundy-dark); }
  .booking-dates{ font-size:13px; color: var(--ink-soft); }
  .money-line{ font-size:13px; margin-top:4px; }
  .money-line span{ margin-left:12px; }
  .paid{ color: var(--sage); font-weight:700; }
  .due{ color:#a33; font-weight:700; }
  .empty{ text-align:center; color: var(--ink-soft); padding: 40px 20px; font-size:14px; }
  .empty .display{ font-size:22px; color: var(--burgundy); display:block; margin-bottom:6px;}
  table{ width:100%; border-collapse: collapse; font-size:13px; }
  th, td{ text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); }
  th{ color: var(--ink-soft); font-weight:600; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,35,32,.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:#fff; border-radius:var(--radius); max-width:360px; width:100%;
    padding:22px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .receipt-box{
    background:#FCFAF6; border:1px dashed var(--line); border-radius:10px;
    padding:16px; font-size:13.5px; line-height:1.9; white-space:pre-wrap;
    font-family: 'Cairo'; color: var(--ink);
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--burgundy-dark); color:#fff; padding:10px 20px;
    border-radius:999px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="lock-screen"></div>

<div class="topbar">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <h1 class="display">💐 Reayoum de la mari</h1>
      <p>إدارة المخزون والحجوزات لمحلك</p>
    </div>
    <button onclick="lockNow()" style="background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Cairo';">🔒 قفل</button>
  </div>
  <div class="scallop"></div>
</div>

<div class="nav">
  <button class="active" data-tab="dashboard">لوحة التحكم</button>
  <button data-tab="dresses">الفساتين</button>
  <button data-tab="bookings">الحجوزات</button>
  <button data-tab="reports">التقارير</button>
</div>

<main id="app"></main>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
const COLORS = {
  'أحمر': '#C0392B', 'أزرق':'#2E5C8A', 'أخضر':'#3F6B4A', 'ذهبي':'#B8935A',
  'وردي':'#D98BA6', 'أبيض':'#E8E2D6', 'أسود':'#2B2320', 'بنفسجي':'#7D5A8C'
};

let state = { dresses: [], bookings: [], tab: 'dashboard', loaded:false };

const hasClaudeStorage = typeof window.storage !== 'undefined';

async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  } else {
    const v = localStorage.getItem(key);
    return v ? { value: v } : null;
  }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
  } else {
    try{ localStorage.setItem(key, value); return { value }; }catch(e){ return null; }
  }
}

async function loadData(){
  try{ const d = await storageGet('dresses'); state.dresses = d ? JSON.parse(d.value) : []; }
  catch(e){ state.dresses = []; }
  try{ const b = await storageGet('bookings'); state.bookings = b ? JSON.parse(b.value) : []; }
  catch(e){ state.bookings = []; }
  state.loaded = true;
}
async function saveDresses(){ await storageSet('dresses', JSON.stringify(state.dresses)); }
async function saveBookings(){ await storageSet('bookings', JSON.stringify(state.bookings)); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function nextDressCode(){
  let max = 0;
  state.dresses.forEach(d=>{
    const m = /FS-(\d+)/.exec(d.code||'');
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'FS-' + String(max+1).padStart(3,'0');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.nav button').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  render();
}
document.querySelectorAll('.nav button').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));

function addDress(e){
  e.preventDefault();
  const f = e.target;
  const dress = {
    id: uid(),
    code: nextDressCode(),
    name: f.name.value.trim(),
    size: f.size.value,
    color: f.color.value,
    price: parseFloat(f.price.value) || 0,
    status: 'available'
  };
  if(!dress.name) return;
  state.dresses.unshift(dress);
  saveDresses();
  f.reset();
  render();
}
function deleteDress(id){ state.dresses = state.dresses.filter(d=>d.id!==id); saveDresses(); render(); }
function setDressStatus(id, status){
  const d = state.dresses.find(d=>d.id===id);
  if(d){ d.status = status; saveDresses(); render(); }
}

function daysBetween(start, end){
  const s = new Date(start), e = new Date(end);
  const diff = Math.round((e-s)/(1000*60*60*24));
  return Math.max(diff, 1);
}

function onBookingDressOrDateChange(form){
  const dressId = form.dress.value;
  const dress = state.dresses.find(d=>d.id===dressId);
  if(dress && form.start.value && form.end.value){
    const days = daysBetween(form.start.value, form.end.value);
    form.total.value = (dress.price * days).toFixed(2);
  }
}

function addBooking(e){
  e.preventDefault();
  const f = e.target;
  const dressId = f.dress.value;
  const dress = state.dresses.find(d=>d.id===dressId);
  if(!dress) return;
  const total = parseFloat(f.total.value) || 0;
  const paid = parseFloat(f.paid.value) || 0;
  const booking = {
    id: uid(),
    dressId,
    dressName: dress.name,
    dressCode: dress.code,
    customer: f.customer.value.trim(),
    phone: f.phone.value.trim(),
    start: f.start.value,
    end: f.end.value,
    total, paid,
    returned: false
  };
  if(!booking.customer || !booking.start || !booking.end) return;
  state.bookings.unshift(booking);
  dress.status = 'rented';
  saveDresses();
  saveBookings();
  f.reset();
  render();
  openReceipt(booking.id);
}

function markReturned(id){
  const b = state.bookings.find(b=>b.id===id);
  if(!b) return;
  b.returned = true;
  const dress = state.dresses.find(d=>d.id===b.dressId);
  if(dress) dress.status = 'cleaning';
  saveDresses(); saveBookings(); render();
}
function deleteBooking(id){ state.bookings = state.bookings.filter(b=>b.id!==id); saveBookings(); render(); }

function updatePayment(id, value){
  const b = state.bookings.find(b=>b.id===id);
  if(!b) return;
  b.paid = Math.max(0, parseFloat(value)||0);
  saveBookings();
  render();
}

function statusLabel(status){ return {available:'متوفر', rented:'مكرى', cleaning:'فالتنظيف'}[status] || status; }

function buildReceiptText(b){
  const remaining = (b.total - b.paid).toFixed(2);
  return `———————————————
      Reayoum de la mari
———————————————
الزبونة: ${b.customer}
${b.phone ? 'الهاتف: '+b.phone+'\n' : ''}الفستان: ${b.dressName} (${b.dressCode})
من: ${b.start}   إلى: ${b.end}
———————————————
المبلغ الكلي: ${b.total.toFixed(2)} درهم
المدفوع: ${b.paid.toFixed(2)} درهم
المتبقي: ${remaining} درهم
———————————————
شكرا لثقتكم`;
}

function openReceipt(bookingId){
  const b = state.bookings.find(x=>x.id===bookingId);
  if(!b) return;
  const text = buildReceiptText(b);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="section-title" style="margin-top:0;"><h2 class="display">وصل الزبون</h2></div>
        <div class="receipt-box" id="receipt-text">${text}</div>
        <div class="btn-row">
          <button class="btn btn-gold" onclick="copyReceipt()">نسخ الوصل</button>
          <button class="btn btn-ghost" onclick="closeModal()">إغلاق</button>
        </div>
      </div>
    </div>
  `;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function copyReceipt(){
  const text = document.getElementById('receipt-text').innerText;
  const finish = ()=> showToast('تم نسخ الوصل ✓');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(()=> fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}
function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){ showToast('تعذر النسخ، انسخ يدويا'); }
}

function renderDashboard(){
  const total = state.dresses.length;
  const rented = state.dresses.filter(d=>d.status==='rented').length;
  const available = state.dresses.filter(d=>d.status==='available').length;
  const activeBookings = state.bookings.filter(b=>!b.returned);

  return `
    <div class="stats">
      <div class="stat-card"><div class="num">${total}</div><div class="label">مجموع الفساتين</div></div>
      <div class="stat-card"><div class="num">${available}</div><div class="label">متوفرة الآن</div></div>
      <div class="stat-card"><div class="num">${rented}</div><div class="label">مكراة حاليا</div></div>
      <div class="stat-card"><div class="num">${activeBookings.length}</div><div class="label">حجوزات نشطة</div></div>
    </div>
    <div class="section-title"><h2 class="display">حجوزات لم ترجع بعد</h2><div class="dash"></div></div>
    <div class="card">
      ${ activeBookings.length ? activeBookings.map(b=>`
        <div class="booking-row">
          <div class="booking-info">
            <b>${b.customer}</b> — ${b.dressName} <span style="color:var(--ink-soft); font-size:12px;">(${b.dressCode})</span>
            <div class="booking-dates">${b.start} إلى ${b.end} ${b.phone ? '· '+b.phone : ''}</div>
            <div class="money-line"><span class="paid">مدفوع: ${b.paid.toFixed(2)}</span><span class="due">متبقي: ${(b.total-b.paid).toFixed(2)}</span></div>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-gold" onclick="openReceipt('${b.id}')">الوصل</button>
            <button class="btn btn-ghost" onclick="markReturned('${b.id}')">تم الإرجاع</button>
          </div>
        </div>
      `).join('') : `<div class="empty"><span class="display">لا توجد حجوزات نشطة</span>كل الفساتين إما متوفرة أو فالتنظيف</div>` }
    </div>
  `;
}

function renderDresses(){
  const options = Object.keys(COLORS).map(c=>`<option value="${c}">${c}</option>`).join('');
  return `
    <div class="section-title"><h2 class="display">إضافة فستان جديد</h2><div class="dash"></div></div>
    <form class="card" onsubmit="addDress(event)">
      <div class="form-grid">
        <div><label>اسم الفستان</label><input name="name" placeholder="مثال: فستان سهرة أحمر" required></div>
        <div><label>المقاس</label><input name="size" placeholder="مثال: 40" ></div>
        <div><label>اللون</label><select name="color">${options}</select></div>
        <div><label>سعر الكراء (يوم)</label><input name="price" type="number" min="0" step="0.01" placeholder="200"></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" type="submit">إضافة الفستان</button></div>
    </form>

    <div class="section-title"><h2 class="display">المخزون</h2><div class="dash"></div></div>
    ${ state.dresses.length ? `<div class="dress-grid">
      ${state.dresses.map(d=>`
        <div class="dress-card">
          <div class="swatch" style="background:${COLORS[d.color]||'#ddd'}"><span class="code-tag">${d.code}</span></div>
          <div class="dress-body">
            <h3>${d.name}</h3>
            <div class="meta">المقاس: ${d.size || '—'}</div>
            <div class="meta">السعر: ${d.price} / يوم</div>
            <span class="badge ${d.status}">${statusLabel(d.status)}</span>
            <div class="dress-actions">
              <select onchange="setDressStatus('${d.id}', this.value)" style="width:auto; padding:6px 8px; font-size:12px;">
                <option value="available" ${d.status==='available'?'selected':''}>متوفر</option>
                <option value="rented" ${d.status==='rented'?'selected':''}>مكرى</option>
                <option value="cleaning" ${d.status==='cleaning'?'selected':''}>فالتنظيف</option>
              </select>
              <button class="btn-danger" onclick="deleteDress('${d.id}')">حذف</button>
            </div>
          </div>
        </div>
      `).join('')}
    </div>` : `<div class="card empty"><span class="display">المخزون فارغ</span>ابدأ بإضافة أول فستان فالأعلى</div>`}
  `;
}

function renderBookings(){
  const availableDresses = state.dresses.filter(d=>d.status==='available');
  const dressOptions = availableDresses.map(d=>`<option value="${d.id}">${d.code} — ${d.name}</option>`).join('')
    || `<option disabled selected>لا توجد فساتين متوفرة</option>`;

  return `
    <div class="section-title"><h2 class="display">حجز جديد</h2><div class="dash"></div></div>
    <form class="card" onsubmit="addBooking(event)" oninput="onBookingDressOrDateChange(this)">
      <div class="form-grid">
        <div><label>الفستان</label><select name="dress" required>${dressOptions}</select></div>
        <div><label>اسم الزبونة</label><input name="customer" required></div>
        <div><label>رقم الهاتف</label><input name="phone"></div>
        <div><label>تاريخ البداية</label><input name="start" type="date" required></div>
        <div><label>تاريخ النهاية</label><input name="end" type="date" required></div>
        <div><label>المبلغ الكلي</label><input name="total" type="number" min="0" step="0.01" placeholder="0"></div>
        <div><label>المبلغ المدفوع</label><input name="paid" type="number" min="0" step="0.01" placeholder="0"></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" type="submit">تسجيل الحجز وطباعة الوصل</button></div>
    </form>

    <div class="section-title"><h2 class="display">كل الحجوزات</h2><div class="dash"></div></div>
    <div class="card">
      ${ state.bookings.length ? state.bookings.map(b=>`
        <div class="booking-row">
          <div class="booking-info">
            <b>${b.customer}</b> — ${b.dressName} <span style="color:var(--ink-soft); font-size:12px;">(${b.dressCode})</span>
            <div class="booking-dates">${b.start} إلى ${b.end} ${b.phone ? '· '+b.phone : ''} ${b.returned ? '· <span style=\"color:var(--sage)\">تم الإرجاع</span>' : ''}</div>
            <div class="money-line">
              الكلي: ${b.total.toFixed(2)} ·
              <span class="paid">مدفوع: ${b.paid.toFixed(2)}</span>
              <span class="due">متبقي: ${(b.total-b.paid).toFixed(2)}</span>
            </div>
            ${ (b.total-b.paid) > 0 ? `<div style="margin-top:6px; display:flex; gap:6px; align-items:center;">
                <input type="number" min="0" step="0.01" placeholder="تحديث المدفوع" style="width:140px; padding:6px 8px; font-size:12px;" onkeydown="if(event.key==='Enter'){ updatePayment('${b.id}', this.value); }">
                <span style="font-size:11px; color:var(--ink-soft);">اضغط Enter للتحديث</span>
              </div>` : '' }
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-gold" onclick="openReceipt('${b.id}')">الوصل</button>
            ${!b.returned ? `<button class="btn btn-ghost" onclick="markReturned('${b.id}')">تم الإرجاع</button>` : ''}
            <button class="btn-danger" onclick="deleteBooking('${b.id}')">حذف</button>
          </div>
        </div>
      `).join('') : `<div class="empty"><span class="display">لا توجد حجوزات بعد</span>سجل أول حجز فالأعلى</div>` }
    </div>
  `;
}

function renderReports(){
  const totalRevenueAgreed = state.bookings.reduce((s,b)=> s + b.total, 0);
  const totalPaid = state.bookings.reduce((s,b)=> s + b.paid, 0);
  const totalDue = totalRevenueAgreed - totalPaid;
  const now = new Date();
  const thisMonth = state.bookings.filter(b=>{
    const d = new Date(b.start);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  const monthPaid = thisMonth.reduce((s,b)=> s + b.paid, 0);

  const rows = state.bookings.slice().sort((a,b)=> (a.start<b.start?1:-1)).map(b=>`
    <tr>
      <td>${b.dressCode}</td>
      <td>${b.customer}</td>
      <td>${b.start}</td>
      <td>${b.total.toFixed(2)}</td>
      <td class="paid">${b.paid.toFixed(2)}</td>
      <td class="due">${(b.total-b.paid).toFixed(2)}</td>
    </tr>
  `).join('');

  return `
    <div class="stats">
      <div class="stat-card good"><div class="num">${totalPaid.toFixed(0)}</div><div class="label">مجموع المدفوع (درهم)</div></div>
      <div class="stat-card warn"><div class="num">${totalDue.toFixed(0)}</div><div class="label">مجموع المتبقي (درهم)</div></div>
      <div class="stat-card"><div class="num">${totalRevenueAgreed.toFixed(0)}</div><div class="label">مجموع الاتفاقات (درهم)</div></div>
      <div class="stat-card"><div class="num">${monthPaid.toFixed(0)}</div><div class="label">مدفوع هذا الشهر</div></div>
    </div>
    <div class="section-title"><h2 class="display">تفاصيل الحجوزات</h2><div class="dash"></div></div>
    <div class="card">
      ${ state.bookings.length ? `<table>
        <thead><tr><th>كود</th><th>الزبونة</th><th>البداية</th><th>الكلي</th><th>مدفوع</th><th>متبقي</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty"><span class="display">لا توجد بيانات بعد</span>سجل حجوزات باش تبان هنا التقارير</div>` }
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = `<div class="empty">جاري التحميل...</div>`; return; }
  if(state.tab === 'dashboard') app.innerHTML = renderDashboard();
  else if(state.tab === 'dresses') app.innerHTML = renderDresses();
  else if(state.tab === 'bookings') app.innerHTML = renderBookings();
  else app.innerHTML = renderReports();
}

async function initApp(){
  await loadData();
  const pass = await storageGet('app_password');
  if(pass && pass.value){
    showLockScreen('login');
  } else {
    showLockScreen('setup');
  }
}

function showLockScreen(mode){
  const root = document.getElementById('lock-screen');
  root.style.display = 'block';
  if(mode === 'setup'){
    root.innerHTML = `
      <div class="modal-overlay" style="z-index:100;">
        <div class="modal">
          <div class="section-title" style="margin-top:0;"><h2 class="display">🔒 تعيين كلمة السر</h2></div>
          <p style="font-size:13px; color:var(--ink-soft); margin-top:-6px;">هاد الكلمة غادي تلزمك باش تدخل للتطبيق فالمرات الجاية</p>
          <form onsubmit="setupPassword(event)">
            <div style="margin-bottom:10px;"><label>كلمة السر</label><input type="password" name="pw1" required minlength="4"></div>
            <div><label>أكد كلمة السر</label><input type="password" name="pw2" required minlength="4"></div>
            <div id="setup-error" style="color:#a33; font-size:13px; margin-top:8px;"></div>
            <div class="btn-row"><button class="btn btn-primary" type="submit">حفظ وتشغيل التطبيق</button></div>
          </form>
        </div>
      </div>
    `;
  } else {
    root.innerHTML = `
      <div class="modal-overlay" style="z-index:100;">
        <div class="modal">
          <div class="section-title" style="margin-top:0;"><h2 class="display">🔒 Reayoum de la mari</h2></div>
          <p style="font-size:13px; color:var(--ink-soft); margin-top:-6px;">دخل كلمة السر باش توصل للتطبيق</p>
          <form onsubmit="loginPassword(event)">
            <input type="password" name="pw" required autofocus placeholder="كلمة السر">
            <div id="login-error" style="color:#a33; font-size:13px; margin-top:8px;"></div>
            <div class="btn-row"><button class="btn btn-primary" type="submit">دخول</button></div>
          </form>
        </div>
      </div>
    `;
  }
}

async function setupPassword(e){
  e.preventDefault();
  const f = e.target;
  if(f.pw1.value !== f.pw2.value){
    document.getElementById('setup-error').textContent = 'كلمتا السر غير متطابقتين';
    return;
  }
  await storageSet('app_password', f.pw1.value);
  unlockApp();
}

async function loginPassword(e){
  e.preventDefault();
  const f = e.target;
  const stored = await storageGet('app_password');
  if(stored && stored.value === f.pw.value){
    unlockApp();
  } else {
    document.getElementById('login-error').textContent = 'كلمة السر غير صحيحة';
  }
}

function unlockApp(){
  const root = document.getElementById('lock-screen');
  root.innerHTML = '';
  root.style.display = 'none';
  render();
}

function lockNow(){
  showLockScreen('login');
}

initApp();
</script>
</body>
</html>
